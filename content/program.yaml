# Programme de Шаг : 140 jours de programme, de zéro à A1 solide + une bonne partie de l'A2.
#
# kind :  alphabet | survival | bilan | normal | consolidation (sans nouveaux éléments)
# slot5 : grammar | fluency  — 5ᵉ unité d'un jour normal (grammaire si le jour introduit une règle)
# slot8 : write | speak      — 8ᵉ unité d'un jour normal (en alternance)
# Rythme visé : ~9–10 nouveaux éléments par jour d'enseignement (plafond 12),
#               ~385 éléments en phase 1, ~650 en phase 2.

phases:
  - id: 0
    title: L'alphabet
    days: [1, 10]
    goals:
      - lire et taper le cyrillique
      - comprendre l'accent tonique
      - dire bonjour, merci, ça va ?
  - id: 1
    title: Les fondations
    days: [11, 55]
    goals:
      - se présenter et discuter simplement par messages
      - le présent, le passé, « où ? » (prépositionnel)
      - ~385 mots et expressions
  - id: 2
    title: Les cas et le mouvement
    days: [56, 140]
    goals:
      - les 6 cas au singulier, l'aspect, le futur
      - les verbes de mouvement, l'impératif
      - ~650 mots et expressions de plus

# Noms propres admis sans être introduits comme éléments (les personnages sont ajoutés automatiquement).
proper_nouns: []

