dialogue:
  messages:
    - { from: masha, ru: "Добрый вечер, Антон!", fr: "Bonsoir, Anton !" }
    - { from: anton, ru: "Добрый вечер! Вот фото. Это мой кот.", fr: "Bonsoir ! Voici une photo. C'est mon chat." }
    - { from: masha, ru: "Большое спасибо! Как его зовут?", fr: "Merci beaucoup ! Comment il s'appelle ?" }
    - { from: anton, ru: "Его зовут Борщ!", fr: "Il s'appelle Bortsch !" }
    - { from: masha, ru: "Борщ? Очень хорошо!", fr: "Bortsch ? Très bien !" }
    - { from: anton, ru: "Спасибо! Спокойной ночи, Маша!", fr: "Merci ! Bonne nuit, Macha !" }
    - { from: masha, ru: "Пока! Спокойной ночи!", fr: "Salut ! Bonne nuit !" }
