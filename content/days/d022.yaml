grammar:
  title: "L'âge : мне … лет"
  explanation: |
    En russe, on ne dit pas « j'ai sept ans » mais « à moi, sept ans » : Мне семь лет.

    Le « à qui » change selon la personne : мне (à moi), тебе (à toi), ему (à lui), ей (à elle). On retrouvera cette forme plus tard, avec le datif.

    Pour l'instant, retiens les phrases toutes faites : Сколько тебе лет? Мне … лет.
  examples:
    - { ru: "Мне пять лет.", fr: "J'ai cinq ans." }
    - { ru: "Ему семь лет.", fr: "Il a sept ans." }
    - { ru: "Сколько тебе лет?", fr: "Quel âge as-tu ?" }
  exercises:
    - { type: translate, fr: "J'ai sept ans.", answers: ["Мне семь лет."] }
    - { type: listen, ru: "восемь", options: ["шесть", "восемь", "девять", "семь"], answer: 1 }
    - { type: listen, ru: "четыре", options: ["четыре", "три", "десять", "пять"], answer: 0 }
    - { type: cloze, ru: "Сколько тебе ___?", answers: ["лет"], fr: "Quel âge as-tu ?" }
write:
