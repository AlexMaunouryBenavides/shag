grammar:
  title: "Mon, ton : мой, твой"
  explanation: |
    Мой (mon) et твой (ton) s'accordent avec le genre de l'objet possédé, pas avec la personne qui possède.

    Masculin : мой телефон. Féminin : моя сумка. Neutre : моё окно. Pluriel : мои часы. Même chose pour твой, твоя, твоё, твои.

    Его (à lui) et её (à elle) ne changent jamais : его сумка, её телефон.
  examples:
    - { ru: "Это мой телефон.", fr: "C'est mon téléphone." }
    - { ru: "Это моя сумка.", fr: "C'est mon sac." }
    - { ru: "Это моё окно.", fr: "C'est ma fenêtre." }
    - { ru: "Это мои часы.", fr: "C'est ma montre." }
    - { ru: "Это её паспорт.", fr: "C'est son passeport (à elle)." }
  exercises:
    - { type: cloze, ru: "Это ___ сумка.", answers: ["моя"], fr: "C'est mon sac." }
    - { type: cloze, ru: "Это ___ телефон?", answers: ["твой"], fr: "C'est ton téléphone ?" }
    - { type: cloze, ru: "Это ___ окно.", answers: ["моё"], fr: "C'est ma fenêtre." }
    - { type: cloze, ru: "Это ___ часы?", answers: ["твои"], fr: "C'est ta montre ?" }
